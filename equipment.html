 if(category!=='all'&&row[1]!==category)return false;
 if(tier!=='all'&&row[2]!==Number(tier))return false;
 if(onlyNeeds&&state[row[0]]!=='need')return false;
 const words=[row[4],row[5],row[6],row[7],row[8],row[9],catalogs.find(c=>c[0]===row[1])?.[2]||''].join(' ').toLocaleLowerCase();
 return !term||words.includes(term.toLocaleLowerCase());
 });$('items').textContent='';
 const fragment=document.createDocumentFragment();
 filtered.forEach(row=>{
 const item=document.createElement('article');item.className='item'+(state[row[0]]==='need'?' print-needed':'');
 const top=document.createElement('div');top.className='item-top';
 const art=document.createElement('span');art.className='item-art';art.textContent=row[3];art.setAttribute('aria-hidden','true');
 const titleWrap=document.createElement('div');titleWrap.className='item-titles';
 const h3=document.createElement('h3');h3.textContent=name(row);
 const meta=document.createElement('div');meta.className='meta';meta.textContent=t.levels[row[2]-1]+' · '+(lang==='sv'?catalogs.find(c=>c[0]===row[1])[2]:catalogs.find(c=>c[0]===row[1])[3]);
 titleWrap.append(meta,h3);top.append(art,titleWrap);
 const summary=document.createElement('p');summary.className='item-summary';summary.textContent=desc(row);
 const details=document.createElement('details');const sum=document.createElement('summary');sum.textContent=t.more;const body=document.createElement('div');body.className='detail-body';const strong=document.createElement('strong');strong.textContent=t.tipLabel+': ';body.append(strong,document.createTextNode(tip(row)));details.append(sum,body);
 const buttons=document.createElement('div');buttons.className='item-buttons';
 for(const value of ['have','need','skip']){const b=document.createElement('button');b.type='button';b.className='status-btn';b.dataset.status=value;b.dataset.id=row[0];b.textContent=t[value];b.setAttribute('aria-pressed',String(state[row[0]]===value));b.setAttribute('aria-label',name(row)+': '+t[value]);buttons.appendChild(b);}
 item.append(top,summary,details,buttons);fragment.appendChild(item);
 });$('items').append(fragment);
 if(!filtered.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=t.none;$('items').appendChild(empty);}
 $('result-count').textContent=filtered.length+' '+t.shown;$('filter-summary').textContent=filtered.length+' / '+raw.length;
 $('summary').replaceChildren(...['have','need','skip'].map((value,i)=>{const el=document.createElement('div');el.className='metric';const b=document.createElement('b');b.textContent=Object.values(state).filter(x=>x===value).length;const span=document.createElement('span');span.textContent=t.summary[i];el.append(b,span);return el;}));
 $('show-needs').textContent=onlyNeeds?t.showAll:t.showNeeds;
 $('print').disabled=!raw.some(row=>state[row[0]]==='need');
}
$('items').addEventListener('click',e=>{const b=e.target.closest('button[data-status]');if(!b)return;const next=b.dataset.status,id=b.dataset.id;if(!raw.some(x=>x[0]===id))return;if(state[id]===next)delete state[id];else state[id]=next;save();render();});
$('categories').addEventListener('click',e=>{const b=e.target.closest('button[data-category]');if(!b)return;category=b.dataset.category;setStatic();render();});
$('search').addEventListener('input',e=>{term=e.target.value;render();});
$('tier').addEventListener('change',e=>{tier=e.target.value;render();});
$('language').addEventListener('change',e=>{lang=e.target.value==='en'?'en':'sv';try{localStorage.setItem(LANG,lang);}catch(e){}setStatic();render();});
$('show-needs').addEventListener('click',()=>{onlyNeeds=!onlyNeeds;render();});
$('print').addEventListener('click',()=>{
 // Print only needed items regardless of the active on-screen filters.
 const old={category,tier,term,onlyNeeds};
 category='all';tier='all';term='';onlyNeeds=true;render();
 const restore=()=>{category=old.category;tier=old.tier;term=old.term;onlyNeeds=old.onlyNeeds;render();window.removeEventListener('afterprint',restore);};
 window.addEventListener('afterprint',restore,{once:true});
 window.print();

});
setStatic();render();
})();
</script>
</body></html>
